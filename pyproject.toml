[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitlc"
version = "0.6.0"
description = "Interactive AI-Driven Testing Life Cycle CLI"
requires-python = ">=3.10"

[project.scripts]
aitlc = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]
